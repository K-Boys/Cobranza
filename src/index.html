<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google AI Studio Angular App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        Object.defineProperty(window, 'fetch', {
          value: window.fetch,
          writable: true,
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Could not patch window.fetch:', e);
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
